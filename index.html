<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محتوى حصري 18+</title>
    <!-- استدعاء مكتبة تيليجرام للويب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --text-main: #ffffff;
            --text-muted: #8a8a9e;
            --accent: #ff3b5c;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .badge {
            background-color: rgba(255, 59, 92, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 59, 92, 0.2);
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px 0;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        /* حاوية الإعلان */
        .ad-container {
            width: 100%;
            min-height: 250px;
            background-color: #24242e;
            border: 2px dashed #3a3a4a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        .ad-placeholder-text {
            color: #555566;
            font-size: 14px;
            font-weight: bold;
        }
        .footer {
            font-size: 12px;
            color: #444455;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">🔞 مخصص للبالغين فقط</div>
        <h1>أهلاً بك في المنطقة الحصرية</h1>
        <p>تم التحقق من عمرك بنجاح. يمكنك الآن استكشاف المحتوى المميز والمنتجات المثيرة.</p>
        
        <!-- ⚠️ منطقة الإعلان: ضع كود ExoClick هنا -->
        <div class="ad-container">
            <!-- احذف النص أدناه وضع كود ExoClick الخاص بك مكانه -->
            <span class="ad-placeholder-text">[ مكان إعلان ExoClick ]</span>
        </div>

        <div class="footer">
            بالبقاء في هذه الصفحة، أنت توافق على شروط الاستخدام.
        </div>
    </div>

    <script>
        // تفعيل وضع ملء الشاشة في تيليجرام
        let tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand(); // جعل الصفحة تملأ الشاشة
            tg.setHeaderColor('#0f0f13'); // تغيير لون الهيدر ليتناسب مع التصميم المظلم
            tg.setBackgroundColor('#0f0f13'); // تغيير لون الخلفية
        }
    </script>
</body>
    </html>
